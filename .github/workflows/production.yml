name: Verify and deploy iAnalyze Academy

on:
  push:
    branches:
      - main
      - codex/supabase-auth-integration

permissions:
  contents: read

concurrency:
  group: ianalyze-academy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ACADEMY_REGISTRATION_APPROVED: ${{ vars.ACADEMY_REGISTRATION_APPROVED }}
    steps:
      - name: Check out the pushed commit and preservation history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --prefix frontend
      - name: Verify the confirmed owner UUID before opening registration
        run: node frontend/scripts/check-registration-readiness.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ACADEMY_LEADER_USER_ID: ${{ secrets.ACADEMY_LEADER_USER_ID }}
      - name: Validate source, security boundaries and both production artifacts
        run: npm --prefix frontend run release:check
      - name: Verify Cloudflare credentials and the existing deployment target
        run: node frontend/scripts/deploy-pages.mjs --check-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Release the gated notebook function and verify identity rejection
        run: npm --prefix frontend run release:edge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish the configured frontend and verify the production alias
        run: npm --prefix frontend run release:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
