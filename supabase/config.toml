# Local development only. Never run config push against the hosted project.
# Hosted target (not linked): ocihwiqtgqplwgyhpwjv; Free; Ireland.
project_id = "ianalyze-academy-local"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
# Verify hosted server version before any future hosted migration approval.
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = false
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "1MiB"
[storage.s3_protocol]
enabled = false
[storage.analytics]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://127.0.0.1:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
[auth.rate_limit]
# Local captured mail only; not hosted SMTP configuration.
email_sent = 1000
sign_in_sign_ups = 100
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
[auth.sms]
enable_signup = false
[auth.external.google]
enabled = false
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
[edge_runtime]
enabled = true
[analytics]
enabled = false

[functions.notebook-submit]
# Auth.getUser(token) + database role checks are mandatory inside the function.
# Supports modern signing keys; this is not an anonymous endpoint.
verify_jwt = false
